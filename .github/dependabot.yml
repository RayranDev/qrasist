# Dependabot: weekly dependency updates, grouped so they arrive as one PR
# per ecosystem instead of dozens. Security advisories are handled by
# GitHub's Dependabot alerts (repository setting), not by this file.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Bogota
    open-pull-requests-limit: 3
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
