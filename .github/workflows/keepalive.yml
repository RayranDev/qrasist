name: Keepalive

# Backup layer: the primary daily activity is the Vercel Cron in
# vercel.json (/api/cron/maintenance), which does real cleanup and
# reads. Supabase pauses free projects without "a few user requests to
# the database each day", and a single query every 2 days was not
# enough (the project paused anyway on Oct 2026).
#
# This job pings /api/health every 6 hours (4 real queries a day even
# if the Vercel cron fails) and fails visibly when the database is down
# (GitHub emails the repo owner). Note: GitHub disables scheduled
# workflows in public repos after 60 days without repo activity, so it
# must not be the only layer.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping production health endpoint
        run: |
          curl --fail --show-error --silent --max-time 20 \
            --retry 3 --retry-delay 15 --retry-all-errors \
            https://qrasist.vercel.app/api/health
