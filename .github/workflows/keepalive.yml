name: Keepalive

# Pings /api/health, which runs a real query against Postgres, so the
# free-tier Supabase project gets database activity and isn't
# auto-paused after 7 idle days.
#
# Runs every 2 days: a weekly cadence left zero margin against the
# 7-day pause, and a single delayed or failed run paused the project.
# /api/health answers 503 when the database is down, so this job fails
# visibly (GitHub emails the repo owner on a failed scheduled run)
# instead of reporting success while the database is paused, which is
# what happened when it pinged /login.
on:
  schedule:
    - cron: '0 12 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping production health endpoint
        run: |
          curl --fail --show-error --silent --max-time 20 \
            --retry 3 --retry-delay 15 --retry-all-errors \
            https://qrasist.vercel.app/api/health
