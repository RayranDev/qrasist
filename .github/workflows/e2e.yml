name: E2E

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Only the services the app actually talks to at runtime
      # (gotrue/postgrest/postgres-meta/storage-api behind kong) --
      # studio, imgproxy, edge-runtime, logflare, vector, realtime,
      # the pooler and the mail catcher aren't exercised by this app
      # or this suite, so skipping them speeds up CI meaningfully.
      - name: Start local Supabase
        run: |
          npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor,mailpit

      - name: Reset database (applies migrations 001-024 + supabase/seed.sql)
        run: npx supabase db reset

      - name: Seed deterministic E2E accounts and data
        run: npm run e2e:seed

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      # playwright.config.ts reads the local stack's URL/keys itself
      # (via `supabase status -o env`) and injects them into the
      # webServer it spawns -- this never touches the shared/production
      # project, which this workflow never even has credentials for.
      - name: Run Playwright E2E suite
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop
